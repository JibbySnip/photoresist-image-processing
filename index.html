<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photoresist Document Converter</title>
    <link rel="stylesheet" href="style.css">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div id="dropbox">
    	<input
  		type="file"
  		id="image-input"
		accept="image/png, image/jpeg"
		class="visually-hidden" />
    	<label for="image-input">Select your image</label>
    </div>
    <div class="container">
  	<div class="row">
    	  <div class="col-6">
    		<canvas id="preview"></canvas>
	  </div>
    	  <div class="col-6">
    		<canvas id="raw" width="200" height="100"></canvas>
	  </div>
        </div>
    </div>
        <form autocomplete="off" id="edit-form" class="row gy-2 gx-3 align-items-center" style="display:none;">
		
	  <p>White areas will be sandblasted away</p>
		<input
		    id="width-input"
		    type="number"
		    min="0.1"
		    max="6"
		    step="0.01"
		    value="6"
		/>
		<label for="width-input">Width (in)</label>

		<input
		    id="height-input"
		    type="number"
		    step="0.01"
		    readonly
		/>
		<label for="height-input">Height (in)</label>

		<input
		    type="number"
		    id="ppi"
		    min="1"
		    max="1200"
		    step="1"
		    value="600"
		/>
		<label for="ppi">PPI</label>

		<input type="range" id="contrast-slider" min=-255 max=255 value=0 step=1 />
		<label for="contrast-slider">Contrast</label>
	<ul class="nav nav-tabs nav-fill" id="mode-tabs" role="tablist">
	  <li class="nav-item" role="presentation">
	    <button class="nav-link active" id="halftone-tab" data-bs-toggle="tab" data-bs-target="#halftone-tab-pane" type="button" role="tab" aria-controls="halftone-tab-pane" aria-selected="true">Halftone</button>
	  </li>
	  <li class="nav-item" role="presentation">
	    <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#threshold-tab-pane" type="button" role="tab" aria-controls="threshold-tab-pane" aria-selected="false">Threshold</button>
	  </li>
	</ul>

	<div class="tab-content" id="tab-content">
	  <div class="tab-pane fade show active" id="halftone-tab-pane" role="tabpanel" aria-labelledby="halftone-tab" tabindex="0">
	  	  <p>Size of dots (dots per inch):</p>
  
		  <input type="radio" id="lpi-35" name="lpi" value="35" />
		  <label for="lpi-35">Small (35)</label><br>

		  <input type="radio" id="lpi-45" name="lpi" value="45" checked />
		  <label for="lpi-45">Medium (45)</label><br>

		  <input type="radio" id="lpi-55" name="lpi" value="55" />
		  <label for="lpi-55">Large (55)</label>

		  <input type="range" id="angle-slider" min=0 max=90 step=0.5 value=37.5 />
		  <label for="angle-slider">Angle of dot grid</label>
		
		<p>Shape of halftone grid</p>
		<input type="radio" id='shape-round' name='shape' checked value="round" />
		<label for="shape-round">&#11044; Round</label>

	  </div>
	  <div class="tab-pane fade" id="threshold-tab-pane" role="tabpanel" aria-labelledby="threshold-tab" tabindex="0">
		<input type="range" id="threshold-slider" min="0" max="255" value="50" step="1" />
		<label for="threshold-slider">Threshold value</label>

	  </div>
	</div>

	<input type="checkbox" id="invert-checkbox" />
	<label for="invert-checkbox">Invert</label>

	<input type="checkbox" id="border-checkbox" />
	<label for="border-checkbox">Add 0.125in border around the image on the final printed film</label>

	<input type="checkbox" id="invert-border-checkbox" style="display:none;"/>
	<label for="invert-border-checkbox">Sandblast the border into the piece</label>

	<button id="submit-edit-form" type="button">Submit</button> 	
    </form>
    <script src="image.js" defer></script>
</body>
</html>
